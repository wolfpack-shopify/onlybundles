[package]
name = "bundle-discount-function"
version = "1.0.0"
edition = "2021"

[dependencies]
bundle-runtime-policy = { path = "../bundle-runtime-policy" }
shopify_function = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
# Match the shared policy crate and Cart Transform's measured WASM size constraint.
serde_json = { version = "=1.0.146", features = ["raw_value"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
